<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Multimedia AI Creator</title>
                <link rel="stylesheet" href="style.css">
                </head>
                <body>
                    <header>
                            <h1>Multimedia AI Creator</h1>
                                </header>

                                    <main id="app-container">
                                            <!-- सभी फीचर्स के बटन यहाँ आएंगे -->



                            
                                                                <button class="btn" id="img-gen">AI Image Generation</button>
                                                                        <!-- AI Image Generation का इनपुट और आउटपुट बॉक्स -->
                                                                                <div id="image-gen-section" class="feature-section">
                                                                                            <h3>AI Image Generator</h3>
                                                                                                        <textarea id="image-prompt" placeholder="यहाँ अपना प्रॉम्ट लिखें... (जैसे: A futuristic city in rain)"></textarea>
                                                                                                                    <button id="generate-image-btn" class="action-btn">Create Image</button>
                                                                                                                                <div id="image-result" class="result-box">
                                                                                                                                                <!-- जेनरेट हुई इमेज यहाँ दिखाई देगी -->
                                                                                                                                                                <p>आपकी इमेज यहाँ दिखाई देगी...</p>
                                                                                                                                                                            </div>
                                                                                                                                                                                    </div>
                                                                                                                                                                                    -->
                                                                            <button class="btn" id="img-edit">Image Editing</button>
                                                                                        <button class="btn" id="ai-video">AI Video</button>
                                                                                                    <button class="btn" id="voice-clone">My Voice / Voice Clone</button>
                                                                                                                <button class="btn" id="voice-over">AI Voice-over</button>
                                                                                                                            <button class="btn" id="script-gen">AI Script Generation</button>
                                                                                                                                    </div>
                                                                                                                                        </main>

                                                                                                                                            <!-- AdMob का स्पेस यहाँ बनेगा -->
                                                                                                                                                <footer id="admob-banner">
                                                                                                                                                        <p>AdMob Banner Space</p>
                                                                                                                                                            </footer>

                                                                                                                                                                <script src="script.js"></script>
                                                                                                                                                                    <script src="app.js"></script>
                                                                                                                                                                    </body>
                                                                                                                                                                    </html>
